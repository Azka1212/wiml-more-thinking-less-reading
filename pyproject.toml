[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiml-more-thinking-less-reading"
version = "0.1.0"
description = "Reproducible analysis and experiment code accompanying the WiML abstract"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wiml-analyze = "wiml.analysis:main"
wiml-experiment = "wiml.experiment:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
